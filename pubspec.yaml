name: bookloom
description: "Bookloom 书织 —— 本地优先的电子书工作台。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  archive: 4.6.0
  crypto: 3.0.8
  drift: ^2.35.3
  file_picker: 13.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  image: 4.12.0
  intl: any
  logging: ^1.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  uuid: 4.6.0
  window_manager: ^0.6.0
  xml: 7.1.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/bookloom-logo.png
    - assets/brand/bookloom-icon.png
    - assets/opencc/
    - licenses/whatwg/LICENSE
    - licenses/opencc/LICENSE
    - licenses/opencc/NOTICE
