name: bookloom
description: "Bookloom 书织 —— 本地优先的电子书工作台。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  drift: ^2.35.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  intl: any
  logging: ^1.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  window_manager: ^0.6.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
